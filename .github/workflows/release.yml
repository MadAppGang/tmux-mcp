name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tell magus-src (the source of the marketplace; MadAppGang/magus is its
  # published output) that a new tmux-mcp binary shipped, so it can patch-bump
  # the terminal plugin that installs this binary via its setup.go dependency
  # (github.com/MadAppGang/tmux-mcp/v2@latest). claudeup notices the plugin
  # version change and re-runs `go install @latest`, pulling the new binary —
  # that is what keeps the plugin and the binary in lockstep.
  #
  # Requires a MAGUS_DISPATCH_TOKEN secret: a PAT with permission to send a
  # repository_dispatch to MadAppGang/magus-src (the built-in GITHUB_TOKEN is
  # scoped to this repo only). Without it, this job logs and skips, so releases
  # are unaffected until the magus-src side is wired up.
  #
  # A MAJOR-version tag does NOT dispatch. See the gate in the step below: the
  # receiver PATCH-bumps the plugin, and a patch bump is a promise that nothing
  # broke.
  notify-plugin:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch terminal-plugin bump to magus-src
        env:
          TOKEN: ${{ secrets.MAGUS_DISPATCH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          # Gate: a MAJOR-version tag (vX.0.0) must not auto-publish.
          #
          # The dispatch patch-bumps the terminal plugin and force-pushes the
          # marketplace to the PUBLIC MadAppGang/magus. On a major release that
          # would ship a binary whose tool surface the already-published plugin's
          # skills still document the old way — every installed user breaks, with
          # no version signal that anything changed. The matching plugin major is
          # written and released by hand, after the tag; automatic bumps resume on
          # the next minor or patch tag, which are backwards compatible by
          # definition and dispatch exactly as they always have.
          #
          # Anything that is not a clean MAJOR.MINOR.PATCH also skips: an
          # unparseable tag must not be assumed compatible.
          CORE="${VERSION%%-*}"   # drop a -rc.1 / -beta prerelease suffix
          CORE="${CORE%%+*}"      # drop +build metadata
          if ! printf '%s' "$CORE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag v${VERSION} is not a plain MAJOR.MINOR.PATCH version — skipping the terminal-plugin bump dispatch."
            echo "The dispatch patch-bumps the plugin, which promises compatibility this tag does not establish."
            exit 0
          fi
          REST="${CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          if [ "$MINOR" -eq 0 ] && [ "$PATCH" -eq 0 ]; then
            echo "Tag v${VERSION} is a MAJOR-version release — skipping the terminal-plugin bump dispatch."
            echo "A major release is breaking. Dispatching would patch-bump the terminal plugin and"
            echo "force-push the public marketplace, handing every installed user a binary the shipped"
            echo "plugin's skills do not describe. Release the matching plugin major by hand; automatic"
            echo "bumps resume on the next minor or patch tag."
            exit 0
          fi

          if [ -z "$TOKEN" ]; then
            echo "MAGUS_DISPATCH_TOKEN not set — skipping the terminal-plugin bump dispatch."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MadAppGang/magus-src/dispatches" \
            -d "{\"event_type\":\"tmux-mcp-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}")
          if [ "$code" = "204" ]; then
            echo "Dispatched tmux-mcp-release v${VERSION} to MadAppGang/magus-src."
          else
            echo "Dispatch to magus-src failed with HTTP ${code}." >&2
            exit 1
          fi

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Wait for release assets to be available
          sleep 10

          # Download checksums
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/checksums.txt" -o checksums.txt

          DARWIN_ARM64_SHA=$(grep "darwin_arm64" checksums.txt | awk '{print $1}')
          DARWIN_AMD64_SHA=$(grep "darwin_amd64" checksums.txt | awk '{print $1}')
          LINUX_ARM64_SHA=$(grep "linux_arm64" checksums.txt | awk '{print $1}')
          LINUX_AMD64_SHA=$(grep "linux_amd64" checksums.txt | awk '{print $1}')

          echo "darwin_arm64_sha=$DARWIN_ARM64_SHA" >> $GITHUB_OUTPUT
          echo "darwin_amd64_sha=$DARWIN_AMD64_SHA" >> $GITHUB_OUTPUT
          echo "linux_arm64_sha=$LINUX_ARM64_SHA" >> $GITHUB_OUTPUT
          echo "linux_amd64_sha=$LINUX_AMD64_SHA" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: MadAppGang/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          cat > tap/Formula/tmux-mcp.rb << 'FORMULA'
          class TmuxMcp < Formula
            desc "MCP server for agent-oriented tmux control with native process detection"
            homepage "https://github.com/MadAppGang/tmux-mcp"
            version "${{ steps.release.outputs.version }}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/MadAppGang/tmux-mcp/releases/download/v${{ steps.release.outputs.version }}/tmux-mcp_darwin_arm64.tar.gz"
                sha256 "${{ steps.release.outputs.darwin_arm64_sha }}"
              end
              on_intel do
                url "https://github.com/MadAppGang/tmux-mcp/releases/download/v${{ steps.release.outputs.version }}/tmux-mcp_darwin_amd64.tar.gz"
                sha256 "${{ steps.release.outputs.darwin_amd64_sha }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/MadAppGang/tmux-mcp/releases/download/v${{ steps.release.outputs.version }}/tmux-mcp_linux_arm64.tar.gz"
                sha256 "${{ steps.release.outputs.linux_arm64_sha }}"
              end
              on_intel do
                url "https://github.com/MadAppGang/tmux-mcp/releases/download/v${{ steps.release.outputs.version }}/tmux-mcp_linux_amd64.tar.gz"
                sha256 "${{ steps.release.outputs.linux_amd64_sha }}"
              end
            end

            depends_on "tmux"

            def install
              bin.install "tmux-mcp"
            end

            test do
              assert_match "tmux-mcp", shell_output("#{bin}/tmux-mcp --help 2>&1", 2)
            end
          end
          FORMULA

      - name: Push to tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tmux-mcp.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update tmux-mcp to v${{ steps.release.outputs.version }}"
          git push
